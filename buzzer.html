<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جهاز الجرس - حروف</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Lalezar&display=swap');
    
    @font-face {
        font-family: 'Galaxy';
        src: url('ArbFONTS-AA-GALAXY.otf'); 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    :root { --main-purple: #392265; --dark-shadow: #1d0b33; }
    
    /* خلفية اللعبة البنفسجية الفخمة مضاف إليها نقش خلايا النحل المطور نفس البي سي */
    body { 
      background-color: #2b164d; 
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='103.923' viewBox='0 0 60 103.923' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 103.923L0 86.603V51.962L30 34.641l30 17.321v34.641L30 103.923zM30 34.641L0 17.321V-17.321L30-34.641l30 17.321V17.321L30 34.641z' stroke='rgba(255,255,255,0.04)' stroke-width='2' fill='none'/%3E%3C/svg%3E"); 
      background-size: 70px 121px;
      color: white; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      overflow-x: hidden; 
      padding-bottom: 30px;
    }

    /* منطقة الشعار العلوي - كأنها منقولة نسخ لصق من الشاشة الرئيسية */
    .top-logo-container { 
      width: 100%; 
      padding: 25px 10px 10px 10px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
    }
    
    .game-logo { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      filter: drop-shadow(0 12px 15px rgba(0,0,0,0.4)); 
      padding: 10px; 
      position: relative; 
    }
    
    /* مقاسات الشعار الكبيرة والمهيبة مع الظلال الثلاثية الأصلية */
    .word-huroof { 
      font-family: 'Galaxy', sans-serif; 
      font-size: 80px; 
      color: #ffca28; 
      text-shadow: 4px 4px 0 var(--dark-shadow), -2px -2px 0 var(--dark-shadow), 2px -2px 0 var(--dark-shadow), -2px 2px 0 var(--dark-shadow), 0 6px 0 var(--dark-shadow); 
      line-height: 1; 
      margin: 0; 
      margin-bottom: -8px; 
      z-index: 3; 
      display: inline-block; 
    }
    
    .word-m3 { 
      font-family: 'Galaxy', sans-serif; 
      font-size: 72px; 
      color: #26a69a; 
      text-shadow: 4px 4px 0 var(--dark-shadow), -2px -2px 0 var(--dark-shadow), 2px -2px 0 var(--dark-shadow), -2px 2px 0 var(--dark-shadow), 0 6px 0 var(--dark-shadow); 
      line-height: 1; 
      margin: 0; 
      z-index: 2; 
      display: inline-block; 
      transform: scaleX(1.4); 
    }
    
    .word-name { 
      font-family: 'Galaxy', sans-serif; 
      font-size: 68px; 
      color: #ff5252; 
      text-shadow: 4px 4px 0 var(--dark-shadow), -2px -2px 0 var(--dark-shadow), 2px -2px 0 var(--dark-shadow), -2px 2px 0 var(--dark-shadow), 0 6px 0 var(--dark-shadow); 
      line-height: 1; 
      margin: 0; 
      margin-top: 5px;
      margin-bottom: 15px; 
      z-index: 1; 
      display: inline-block; 
      white-space: nowrap; 
    }

    .session-badge { 
      background: #392265; 
      color: #ffca28; 
      padding: 5px 22px; 
      border-radius: 50px; 
      font-weight: 900; 
      font-size: 15px; 
      display: inline-block; 
      margin-top: 5px; 
      border: 2px solid rgba(255,255,255,0.1); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* حاويات البطاقات بتصميم بنفسجي داكن فخم مقتبس من ستايل البي سي */
    .card-container { 
      background: rgba(57, 34, 101, 0.9); 
      border: 2px solid rgba(255, 255, 255, 0.15); 
      width: 90%; 
      max-width: 400px; 
      border-radius: 24px; 
      padding: 30px 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
      text-align: center;
      margin-top: 10px;
    }

    .instruction-text { font-size: 19px; font-weight: 900; color: #ffca28; margin-bottom: 25px; line-height: 1.5; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
    .input-group { margin-bottom: 25px; text-align: right; }
    .input-label { display: block; font-weight: 900; color: #fff; margin-bottom: 10px; font-size: 15px; padding-right: 5px; }
    
    .input-field { 
      width: 100%; 
      background: rgba(0,0,0,0.3); 
      border: 2px solid rgba(255,255,255,0.2); 
      border-radius: 15px; 
      color: #fff; 
      padding: 15px; 
      font-size: 17px; 
      font-weight: bold; 
      outline: none; 
      transition: 0.2s; 
      text-align: center; 
    }
    .input-field:focus { border-color: #ffca28; background: rgba(0,0,0,0.5); box-shadow: 0 0 10px rgba(255,202,40,0.2); }

    .team-selector { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
    .team-btn { 
      width: 100%; 
      padding: 15px; 
      border: 2px solid rgba(255,255,255,0.15); 
      border-radius: 15px; 
      font-size: 18px; 
      font-weight: 900; 
      cursor: pointer; 
      color: #eee; 
      background: rgba(255,255,255,0.05); 
      transition: all 0.2s; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .submit-btn { 
      background: linear-gradient(45deg, #ffca28, #ffb300); 
      color: #392265; 
      font-size: 22px; 
      font-weight: 900; 
      border: none; 
      border-radius: 15px; 
      width: 100%; 
      padding: 15px; 
      cursor: pointer; 
      box-shadow: 0 6px 20px rgba(255, 202, 40, 0.4); 
      transition: 0.2s; 
    }
    .submit-btn:active { transform: scale(0.97); }

    .player-info-box { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(0,0,0,0.3); 
      padding: 15px; 
      border-radius: 15px; 
      margin-bottom: 25px; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    .player-name-val { font-weight: 900; font-size: 20px; color: #ffca28; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .player-team-val { font-weight: 900; font-size: 15px; padding: 6px 16px; border-radius: 10px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

    .note-text { font-size: 15px; font-weight: bold; color: #ddd; line-height: 1.6; margin-bottom: 30px; padding: 0 5px; }

    /* روعة تصميم الجرس المحيطي والمضيء */
    .buzzer-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
    .buzzer-btn { 
      width: 210px; 
      height: 210px; 
      border-radius: 50%; 
      border: 10px solid rgba(255,255,255,0.12); 
      color: white; 
      font-family: 'Lalezar', sans-serif; 
      font-size: 52px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      -webkit-user-select: none; user-select: none; 
      -webkit-tap-highlight-color: transparent; 
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5); 
    }
    .buzzer-btn:active { transform: scale(0.90); border-width: 5px; }
    .buzzer-btn.locked { background: #555555 !important; color: #888 !important; border-color: #444 !important; box-shadow: none !important; pointer-events: none; text-shadow: none; }

    .status-badge { font-size: 19px; font-weight: 900; color: #12b49c; background: rgba(18, 180, 156, 0.15); padding: 10px 24px; border-radius: 50px; margin-top: 25px; border: 2px solid #12b49c; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .status-badge.locked-status { color: #ff5252; background: rgba(255, 82, 82, 0.15); border-color: #ff5252; }
    .status-badge.winner-status { color: #ffca28; background: #392265; border-color: #ffca28; box-shadow: 0 0 20px rgba(255, 202, 40, 0.4); }

    .change-info-link { color: #bbb; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 15px; margin-top: 15px; display: inline-block; transition: 0.2s; }
    .change-info-link:hover { color: #ffca28; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="top-logo-container">
    <div class="game-logo">
      <h1 class="logo-word word-huroof">حروف</h1>
      <h1 class="logo-word word-m3">مــــع</h1>
      <h1 class="logo-word word-name" id="bell-title-comp">اسمك</h1>
    </div>
    <div class="session-badge" id="session-name-display">جلسة رقم: --</div>
  </div>

  <div class="card-container" id="login-screen">
    <div class="instruction-text">ادخل اسمك واختر فريقك لتفعيل الجرس!</div>
    <div class="input-group">
      <label class="input-label">اسم اللاعب:</label>
      <input type="text" id="player-name-input" class="input-field" placeholder="اكتب اسمك هنا..." autocomplete="off">
    </div>
    <div class="team-selector">
      <button class="team-btn" id="select-t1-btn" onclick="pickTeam(0)">الفريق الأول</button>
      <button class="team-btn" id="select-t2-btn" onclick="pickTeam(1)">الفريق الثاني</button>
    </div>
    <button class="submit-btn" onclick="enterBuzzerSession()">دخول الجرس</button>
  </div>

  <div class="card-container hidden" id="buzzer-screen">
    <div class="player-info-box">
      <div class="player-name-val" id="lbl-player-name">--</div>
      <div class="player-team-val" id="lbl-player-team">--</div>
    </div>
    <div class="note-text">اضغط فور معرفتك للإجابة.<br>الجرس سيقفل ويفتح تلقائياً حسب الوقت.</div>
    <div class="buzzer-wrapper">
      <button class="buzzer-btn" id="buzzer-click-btn" ontouchstart="triggerBuzzerPress()" onmousedown="triggerBuzzerPress()">اضغط !</button>
      <div class="status-badge" id="buzzer-status-lbl">الجرس جاهز</div>
    </div>
    <div class="change-info-link" onclick="backToLoginProfile()">تغيير الاسم والفريق</div>
  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get('room');
    
    document.getElementById('session-name-display').textContent = `الجلسة: ${roomID}`;
    socket.emit('join-room', { roomID: roomID, playerName: 'لاعب' });

    let selectedTeamIndex = null; 
    let teamNames = ["الفريق الأول", "الفريق الثاني"];
    let t1Color = '#12b49c'; let t2Color = '#f37021';
    let localPlayer = { name: '', team: '', color: '' };

    socket.on('settings', (settings) => {
      document.getElementById('bell-title-comp').textContent = settings.competitionName || 'اسم المسابقة';
      teamNames[0] = settings.team1Name || "الفريق الأول";
      teamNames[1] = settings.team2Name || "الفريق الثاني";
      t1Color = settings.team1Color || '#12b49c';
      t2Color = settings.team2Color || '#f37021';

      document.getElementById('select-t1-btn').textContent = teamNames[0];
      document.getElementById('select-t2-btn').textContent = teamNames[1];
      if (selectedTeamIndex !== null) pickTeam(selectedTeamIndex);
    });

    function pickTeam(index) {
      selectedTeamIndex = index;
      const btn1 = document.getElementById('select-t1-btn');
      const btn2 = document.getElementById('select-t2-btn');
      btn1.style.background = 'rgba(255,255,255,0.05)'; btn1.style.color = '#ddd'; btn1.style.borderColor = 'rgba(255,255,255,0.15)';
      btn2.style.background = 'rgba(255,255,255,0.05)'; btn2.style.color = '#ddd'; btn2.style.borderColor = 'rgba(255,255,255,0.15)';

      if (index === 0) { btn1.style.background = t1Color; btn1.style.color = 'white'; btn1.style.borderColor = t1Color; } 
      else { btn2.style.background = t2Color; btn2.style.color = 'white'; btn2.style.borderColor = t2Color; }
    }

    function enterBuzzerSession() {
      const name = document.getElementById('player-name-input').value.trim();
      if (!name) { alert('الرجاء إدخال الاسم قبل الدخول!'); return; }
      if (selectedTeamIndex === null) { alert('الرجاء اختيار فريقك أولاً!'); return; }

      localPlayer.name = name;
      localPlayer.team = teamNames[selectedTeamIndex];
      localPlayer.color = selectedTeamIndex === 0 ? t1Color : t2Color;

      document.getElementById('lbl-player-name').textContent = localPlayer.name;
      const teamBadge = document.getElementById('lbl-player-team');
      teamBadge.textContent = localPlayer.team;
      teamBadge.style.background = localPlayer.color;

      applyBuzzerColor(localPlayer.color);
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('buzzer-screen').classList.remove('hidden');
    }

    function applyBuzzerColor(color) {
      const buzzerBtn = document.getElementById('buzzer-click-btn');
      buzzerBtn.style.background = `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0.3) 100%)`;
      buzzerBtn.style.backgroundColor = color;
      buzzerBtn.style.boxShadow = `0 15px 40px ${color}90, inset 0 -8px 25px rgba(0,0,0,0.3)`;
    }

    function backToLoginProfile() {
      document.getElementById('buzzer-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function triggerBuzzerPress() {
      if (document.getElementById('buzzer-click-btn').classList.contains('locked')) return;
      socket.emit('buzzer-press', {
          roomID: roomID,
          playerName: localPlayer.name,
          teamName: localPlayer.team
      });
    }

    socket.on('game-state', (state) => {
      const buzzerBtn = document.getElementById('buzzer-click-btn');
      const statusLbl = document.getElementById('buzzer-status-lbl');

      if (state.buzzerLocked) {
        buzzerBtn.classList.add('locked');
        buzzerBtn.style.background = ''; 
        buzzerBtn.style.boxShadow = 'none';

        if (state.buzzerWinner && state.buzzerWinner.name === localPlayer.name) {
          statusLbl.textContent = `أنت الأسرع! جاوب ⏱️ ${state.timeLeft}`;
          statusLbl.className = "status-badge winner-status";
        } else {
          statusLbl.textContent = `مغلق! (${state.buzzerWinner ? state.buzzerWinner.name : 'آخر'}) يجاوب`;
          statusLbl.className = "status-badge locked-status";
        }
      } else {
        buzzerBtn.classList.remove('locked');
        applyBuzzerColor(localPlayer.color); 
        statusLbl.textContent = "الجرس جاهز";
        statusLbl.className = "status-badge";
      }
    });

    socket.on('timer-tick', (data) => {
      const statusLbl = document.getElementById('buzzer-status-lbl');
      if (document.getElementById('buzzer-click-btn').classList.contains('locked')) {
        if (data.phase === 'otherTeam') {
           statusLbl.textContent = `مغلق! وقت الفريق الآخر ⏱️ ${data.timeLeft}`;
           statusLbl.className = "status-badge locked-status";
        } else {
           if (statusLbl.classList.contains('winner-status')) {
             statusLbl.textContent = `أنت الأسرع! جاوب ⏱️ ${data.timeLeft}`;
           } else {
             statusLbl.textContent = `مغلق! يجاوب الآن ⏱️ ${data.timeLeft}`;
           }
        }
      }
    });

    socket.on('timer-phase-change', (data) => {
      const statusLbl = document.getElementById('buzzer-status-lbl');
      statusLbl.textContent = `مغلق! وقت الفريق الآخر ⏱️ ${data.timeLeft}`;
      statusLbl.className = "status-badge locked-status";
    });

    socket.on('buzzer-reset', () => {
      const buzzerBtn = document.getElementById('buzzer-click-btn');
      const statusLbl = document.getElementById('buzzer-status-lbl');
      buzzerBtn.classList.remove('locked');
      if (localPlayer.color) applyBuzzerColor(localPlayer.color);
      statusLbl.textContent = "الجرس جاهز";
      statusLbl.className = "status-badge";
    });
  </script>
</body>
</html>
